services:
  drinksDB:
    image: mysql:9.7.0
    container_name: drinksDB
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: restdb
      MYSQL_USER: restadmin
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "restadmin", "-pmome"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - drinksLab-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
    networks:
      - drinksLab-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      AUTH_TYPE: DISABLED # Falls du lokal kein Login willst
      # Sagt der UI, dass sie auf Links mit diesem Präfix reagieren soll
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
    networks:
      - drinksLab-net
    depends_on:
      - kafka

  auth-server:
    image: megmus/spring-auth-server:0.1.3-SNAPSHOT
    container_name: auth-server
    ports:
      - "9000"
    networks:
      - drinksLab-net
    environment:
      SPRING_APPLICATION_NAME: "auth-server"
      SPRING_DATASOURCE_URL: "jdbc:mysql://drinksDB:3306/restdb"
      SPRING_DATASOURCE_USERNAME: "restadmin"
      SPRING_DATASOURCE_PASSWORD: ${DB_USER_PASSWORD}
      SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_ISSUER: "http://localhost:8080"
      SERVER_FORWARD_HEADERS_STRATEGY: "framework"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
      SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED: "true"
      SPRING_KAFKA_PRODUCER_OBSERVATION_ENABLED: "true"
      SPRING_KAFKA_CONSUMER_OBSERVATION_ENABLED: "true"
      LOGGING_PATTERN_CORRELATION: "%5p [${SPRING_APPLICATION_NAME:-unknown},%X{traceId:-},%X{spanId:-}] "
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "prometheus,health,info,tracing"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    depends_on:
      drinksDB:
          condition: service_started
      zipkin:
          condition: service_healthy

  drinks-service:
    image: megmus/spring-drinksapp:0.1.7-SNAPSHOT
    container_name: drinks-service
    hostname: drinks-service
    ports:
      - "8085"
    networks:
      drinksLab-net:
        aliases:
          - drinks-service
    environment:
      SPRING_APPLICATION_NAME: "drinks-service"
      SPRING_PROFILES_ACTIVE: "default"
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: "jdbc:mysql://drinksDB:3306/restdb?connectTimeout=10000&socketTimeout=60000&autoReconnect=true"
      SPRING_DATASOURCE_USERNAME: "restadmin"
      SPRING_DATASOURCE_PASSWORD: ${DB_USER_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8080"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://auth-server:9000/oauth2/jwks"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: "oidc-client"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
      SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED: "true"
      SPRING_KAFKA_PRODUCER_OBSERVATION_ENABLED: "true"
      SPRING_KAFKA_CONSUMER_OBSERVATION_ENABLED: "true"
      LOGGING_PATTERN_CORRELATION: "%5p [${SPRING_APPLICATION_NAME:-unknown},%X{traceId:-},%X{spanId:-}] "
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "prometheus,health,info,tracing"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    volumes:
      - ~/myapp-logs/:/workspace/logs
    depends_on:
      drinksDB:
        condition: service_healthy
      auth-server:
        condition: service_started
      zipkin:
          condition: service_healthy

  icecold-drinks-service:
    container_name: icecolddrinks-service
    image: megmus/spring-icecoldservice:0.1.5-SNAPSHOT
    ports:
      - "9090"
    networks:
      - drinksLab-net
    environment:
      SPRING_APPLICATION_NAME: "icecold-drinks-service"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8080"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://auth-server:9000/oauth2/jwks"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: "oidc-client"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
      SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED: "true"
      SPRING_KAFKA_PRODUCER_OBSERVATION_ENABLED: "true"
      SPRING_KAFKA_CONSUMER_OBSERVATION_ENABLED: "true"
      LOGGING_PATTERN_CORRELATION: "%5p [${SPRING_APPLICATION_NAME:-unknown},%X{traceId:-},%X{spanId:-}] "
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "prometheus,health,info,tracing"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    depends_on:
      auth-server:
        condition: service_started
      drinks-service:
        condition: service_started
      kafka:
        condition: service_started
      zipkin:
        condition: service_healthy

  cold-drinks-service:
    container_name: colddrinks-service
    image: megmus/spring-coldservice:0.1.5-SNAPSHOT
    ports:
      - "9094"
    networks:
      - drinksLab-net
    environment:
      SPRING_APPLICATION_NAME: "cold-drinks-service"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8080"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://auth-server:9000/oauth2/jwks"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: "oidc-client"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
      SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED: "true"
      SPRING_KAFKA_PRODUCER_OBSERVATION_ENABLED: "true"
      SPRING_KAFKA_CONSUMER_OBSERVATION_ENABLED: "true"
      LOGGING_PATTERN_CORRELATION: "%5p [${SPRING_APPLICATION_NAME:-unknown},%X{traceId:-},%X{spanId:-}] "
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "prometheus,health,info,tracing"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    depends_on:
      auth-server:
        condition: service_started
      drinks-service:
        condition: service_started
      kafka:
        condition: service_started
      zipkin:
        condition: service_healthy

  cool-drinks-service:
    container_name: cooldrinks-service
    image: megmus/spring-coolservice:0.1.5-SNAPSHOT
    ports:
      - "9096"
    networks:
      - drinksLab-net
    environment:
      SPRING_APPLICATION_NAME: "cool-drinks-service"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8080"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://auth-server:9000/oauth2/jwks"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: "oidc-client"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
      SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED: "true"
      SPRING_KAFKA_PRODUCER_OBSERVATION_ENABLED: "true"
      SPRING_KAFKA_CONSUMER_OBSERVATION_ENABLED: "true"
      LOGGING_PATTERN_CORRELATION: "%5p [${SPRING_APPLICATION_NAME:-unknown},%X{traceId:-},%X{spanId:-}] "
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "prometheus,health,info,tracing"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    depends_on:
      auth-server:
        condition: service_started
      drinks-service:
        condition: service_started
      kafka:
        condition: service_started
      zipkin:
        condition: service_healthy

  drinks-shop:
    container_name: drinks-shop
    image: megmus/spring-drinksapp-gateway:0.1.9-SNAPSHOT
    ports:
      - "8080:8080"
    networks:
      - drinksLab-net
    environment:
      JAVA_TOOL_OPTIONS: "-Dmanagement.tracing.export.zipkin.endpoint=http://zipkin:9411/api/v2/spans -Dmanagement.observations.http.server.requests.enabled=true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8080"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://auth-server:9000/oauth2/jwks"

      SPRING_APPLICATION_NAME: "drinks-shop"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin:9411/api/v2/spans"
      SPRING_REACTOR_CONTEXT_PROPAGATION: "auto"
      SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED: "true"
      SPRING_KAFKA_PRODUCER_OBSERVATION_ENABLED: "true"
      SPRING_KAFKA_CONSUMER_OBSERVATION_ENABLED: "true"
      LOGGING_PATTERN_CORRELATION: "%5p [${SPRING_APPLICATION_NAME:-unknown},%X{traceId:-},%X{spanId:-}] "
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: "auth-route"
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: "http://auth-server:9000"
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: "Path=/oauth2/**"
      SPRING_CLOUD_GATEWAY_ROUTES_0_FILTERS_0: "PreserveHostHeader"
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: "drinks-service-route"
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: "http://drinks-service:8085"
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: "Path=/api/**"
      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: "kafka-ui-route"
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: "http://kafka-ui:8080"
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: "Path=/kafka-ui/**"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "prometheus,health,info,tracing"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"

    depends_on:
      auth-server:
        condition: service_started
      drinks-service:
        condition: service_started
      kafka-ui:
        condition: service_started
      zipkin:
        condition: service_healthy

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "9411" ]
      interval: 5s
      timeout: 2s
      retries: 5
    networks:
      - drinksLab-net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - drinksLab-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GR_ADMIN_PASSWORT}
    networks:
      - drinksLab-net


networks:
  drinksLab-net:
    name: drinksLab-net
    driver: bridge